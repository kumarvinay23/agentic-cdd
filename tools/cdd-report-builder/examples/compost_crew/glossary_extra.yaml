# Deal-specific glossary terms (content.json -> glossary_extra)
DMV: "Washington DC, Maryland and Virginia metropolitan region."
NOVA: "Northern Virginia."
Tipping fee: "Fee charged by a processing facility to accept a ton of material."
Compost Outpost: "Compost Crew's small modular composting site (company trademark)."
CLIN: "Contract line item number in a government contract."
Participation cap: "Maximum number of households a municipal contract allows to enrol in a given year."
