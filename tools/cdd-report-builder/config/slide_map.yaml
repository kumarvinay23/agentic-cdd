- id: S009_company_snapshot
  'no': 9
  section: business
  archetype: kpi_panel
  exhibit: kpi_strip
  gate: core
  provenance: blueprint
  blueprint_title: Company Overview & Financial Snapshot
  purpose: Introduce the Target's model, scale, and trajectory on a single page.
  must_contain:
