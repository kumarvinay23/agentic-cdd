- id: S014_model_scorecard
  'no': 14
  section: business
  archetype: table_full
  exhibit: scorecard
  gate: research_gated
  provenance: blueprint
  blueprint_title: Model Scorecard vs Customer Selection Criteria
  purpose: Score each model against what customers actually weigh — and read off right-to-win.
  must_contain:
  - Matrix rows = selection considerations (risk / liability, revenue model, technical flexibility, branding
