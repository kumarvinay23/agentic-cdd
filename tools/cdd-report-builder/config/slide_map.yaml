version: 3
blueprint: 97-slide CDD reporting standard + 4-slide DiligenceIQ evidence appendix
canvas:
  width_in: 13.333
  height_in: 7.5
defaults:
  title:
    max_chars: 165
    font_pt: 20
    font_min_pt: 18
  subtitle:
    max_chars: 150
    font_pt: 13
    font_min_pt: 12
  body:
    font_pt: 12
    font_min_pt: 10
  table:
    font_pt: 10.5
    font_min_pt: 9
    max_rows: 9
  source:
    auto: true
  not_provided_text: Not provided in agent outputs
  insufficient_text: Insufficient evidence
  research_gap_text: Requires primary research (survey / interview programme)
gates:
  always:
    renders: unconditional
  core:
    renders: always; blocker if unsupported
    min_facts: 1
    blocker: true
    accepts_fallback: true
    fallback_min_facts: 3
    fallback_exception: E12-SUBSTITUTION
  conditional:
    renders: if evidence available
    min_facts: 3
    exception: E1-NOT-PROVIDED
  research_gated:
    renders: if survey or interview sources present
    min_facts: 3
    requires_doc_types:
    - survey
    - interviews
    min_n: 30
    exception: E11-NO-PRIMARY
  derived:
    renders: unconditional
    built_from: run data
sections:
- id: front
  name: Engagement Overview
  blurb: Who commissioned the work, what was asked and how it was answered
- id: business
  name: Business Introduction & Market Primer
  blurb: Who the target is, how the industry works and where the target sits in it
- id: highlights
  name: Investment Highlights
  blurb: The main findings, each stated at the strength of its evidence
- id: market
  name: Market Dynamics & Opportunity
  blurb: How large, how fast-growing and how resilient the addressable market is
- id: decisions
  name: Decision-Making Dynamics
  blurb: How buyers choose, what makes them switch and how hard switching is
- id: competition
  name: Competitive Landscape
  blurb: Who the target competes with and whether its advantages hold up
- id: growth
  name: Growth Opportunities
  blurb: Where the incremental value is and what has to be true to capture it
- id: appx_partners
  name: Appendix A - Partner & Vendor Landscape
  blurb: The ecosystem around the target
- id: appx_sizing
  name: Appendix B - Market Sizing Methodology
  blurb: How every number in the sizing was built
- id: appx_cases
  name: Appendix C - Case Studies
  blurb: Individual buyer journeys in full
- id: appx_supp
  name: Appendix D - Supplementary Data
  blurb: Supporting detail behind the findings
- id: appx_audit
  name: Appendix E - Evidence & Audit Trail
  blurb: Module verdicts, source register and exceptions
slides:
- id: S001_cover
  'no': 1
  section: front
  archetype: cover
  exhibit: cover
  gate: always
  provenance: blueprint
  blueprint_title: Cover Page
  purpose: Identify the engagement, the parties, and confidentiality status at a glance.
  must_contain:
  - Project codename ('Project [X]'), engagement type (sell-side / buy-side support) and report status
    (Draft / Final).
  - Advisory team with named leads and contact details; client identified per the engagement letter.
  - Date of issue and a clear CONFIDENTIAL designation in the top corner.
  - Clean, brand-led layout — no findings, data, or claims on the cover.
  source_spec: Engagement letter / SOW; deal-team roster; client naming conventions.
  analysis: None — purely identifying. Confirm codename and permitted recipients with the client first.
  exhibit_spec: 'Full-bleed branded cover: title block + team block, no data.'
  quality_bar: Confirm the confidentiality designation and approved recipient list before any draft circulates.
  primary_modules: []
  fallback_modules: []
  secondary_modules: []
  metrics: []
  transform:
  - T0-AUTO
  calc: []
  source_priority:
  - R3
  - R5
  exception:
  - E1-NOT-PROVIDED
  heads: {}
  elements:
  - name: report_title
    type: text
    limits:
      max_chars: 320
  - name: report_subtitle
    type: text
    limits:
      max_chars: 320
  - name: prepared_for
    type: text
    limits:
      max_chars: 320
  - name: report_date
    type: text
    limits:
      max_chars: 320
- id: S002_disclaimer
  'no': 2
  section: front
  archetype: disclaimer
  exhibit: text_panel
  gate: always
  provenance: blueprint
  blueprint_title: Disclaimer & Reliance Limitations
  purpose: Define scope, reliance, and the limits of assurance before any finding is read.
  must_contain:
  - State the report was prepared for the named client, on topics the client identified, using only the
    procedures the client requested.
  - Clarify the report provides no assurance and is subject to limitations; recipients accept its scope.
  - 'Set third-party terms: recipients must perform their own diligence and acquire no rights against
    the advisor.'
  - Prohibit redistribution except by legal process, with indemnification language for downstream claims.
  source_spec: Firm legal / risk template; reliance language from the engagement letter.
  analysis: None — legal boilerplate tailored to scope; route new client types or geographies through
    legal review.
  exhibit_spec: Text-only bullet slide, kept identical across every report.
  quality_bar: Never soften reliance language to please a prospective buyer — disclaimer scope creep is
    a liability.
  primary_modules: []
  fallback_modules: []
  secondary_modules: []
  metrics: []
  transform:
  - T1-EXTRACT
  - T12-COMPANY-VS-MARKET
  - T8-FACT-VS-VIEW
  calc: []
  source_priority:
  - R3
  - R5
  exception:
  - E1-NOT-PROVIDED
  heads: {}
  elements:
  - name: disclaimer_body
    type: text
    limits:
      max_chars: 1500
  - name: data_notice
    type: text
    limits:
      max_chars: 420
- id: S003_engagement
  'no': 3
  section: front
  archetype: columns5
  exhibit: banded_table
  gate: core
  provenance: blueprint
  blueprint_title: Engagement Overview & Objectives
  purpose: State the mandate in one sentence and decompose it into the five diligence workstreams.
  must_contain:
  - Action title naming what the client engaged the firm to assess (market opportunity, customer sentiment,
    competitive positioning, growth avenues).
  - A 'Primary Objectives' strip summarising the mandate in one full sentence.
  - Five numbered workstreams — Business Primer · Market Dynamics & Opportunity · Customer Dynamics &
    Feedback · Competitive Landscape & Positioning · Growth Opportunities.
  - Three to five scope bullets under each workstream stating exactly what will be assessed, defined,
    or validated.
  source_spec: Kick-off materials; the sponsor's underwriting questions and stated IC concerns.
  analysis: Translate the buyer's underwriting questions into testable workstreams and scope bullets.
  exhibit_spec: Objectives banner + five-column workstream grid with scope bullets.
  quality_bar: Objectives must mirror the buyer's actual decision criteria — not a generic checklist.
  primary_modules:
  - SCM
  fallback_modules:
  - EXS
  - REC
  secondary_modules:
  - EXS
  - DCO
  metrics: []
  transform:
  - T1-EXTRACT
  - T12-COMPANY-VS-MARKET
  - T8-FACT-VS-VIEW
  calc: []
  source_priority:
  - R3
  - R5
  exception:
  - E1-NOT-PROVIDED
  heads: {}
  elements:
  - name: lead
    type: text
    limits:
      max_chars: 320
  - name: col1_body
    type: bullets
    limits:
      max_items: 4
      max_chars_item: 95
  - name: col2_body
    type: bullets
    limits:
      max_items: 4
      max_chars_item: 95
  - name: col3_body
    type: bullets
    limits:
      max_items: 4
      max_chars_item: 95
  - name: col4_body
    type: bullets
    limits:
      max_items: 4
      max_chars_item: 95
  - name: col5_body
    type: bullets
    limits:
      max_items: 4
      max_chars_item: 95
- id: S004_contents
  'no': 4
  section: front
  archetype: contents
  exhibit: text_panel
  gate: derived
  provenance: blueprint
  blueprint_title: Contents
  purpose: Give the reader a two-level map of the report with page references.
  must_contain:
  - 'Top-level sections in reading order: Engagement Overview · Business Introduction & Market Primer
    · Investment Highlights · Detailed Findings · Appendix.'
  - Detailed Findings expanded into its four workstream chapters, each with its page number.
  - Appendix expanded into its lettered parts (landscape, sizing methodology, case studies, supplementary
    data).
  - Page references verified against final pagination.
  source_spec: Final deck pagination.
  analysis: None — navigation only.
  exhibit_spec: Two-level indented contents list with right-aligned page numbers.
  quality_bar: Section titles and page numbers must match the dividers and footers exactly.
  primary_modules: []
  fallback_modules: []
  secondary_modules: []
  metrics: []
  transform:
  - T0-AUTO
  calc: []
  source_priority:
  - R3
  - R5
  exception:
  - E1-NOT-PROVIDED
  heads: {}
  elements:
  - name: contents_body
    type: auto
- id: S005_research_approach
  'no': 5
  section: front
  archetype: table_commentary
  exhibit: banded_table
  gate: core
  provenance: blueprint
  blueprint_title: Research Approach & Interview Sample
  purpose: Show the evidence base — how many conversations, of what type, from which perspectives.
  must_contain:
  - Statement that findings combine primary research (interviews, survey) with secondary data analysis,
    and what the interviews focused on.
  - Phone interview table by interviewee type (target customers, competitor customers, competitors, partners)
    with counts and total [n = X].
  - Survey sample table by respondent type with counts and total [n = X].
  - Logo wall of organizations interviewed (anonymise where required).
  source_spec: Interview tracker; survey-platform export; primary-research logs.
  analysis: Report every n transparently; note the sample is built for triangulation, not statistical
    precision.
  exhibit_spec: Two count tables + interviewed-organizations logo wall.
  quality_bar: Disclose every sample size — findings from a handful of calls must never be dressed as
    consensus.
  primary_modules:
  - SCM
  fallback_modules:
  - EXS
  - APX
  secondary_modules: []
  metrics: []
  transform:
  - T1-EXTRACT
  - T10-NARRATIVE-TO-TABLE
  - T12-COMPANY-VS-MARKET
  - T2-COMBINE
  - T8-FACT-VS-VIEW
  - T9-DEDUP
  calc: []
  source_priority:
  - R3
  - R5
  exception:
  - E1-NOT-PROVIDED
  heads:
    left_head: Evidence base by source type
    right_head: Coverage, limitations and what was not available
  elements:
  - name: left
    type: table
    head: Evidence base by source type
    limits:
      max_rows: 9
      max_cols: 6
      max_chars_cell: 90
  - name: right
    type: bullets
    head: Coverage, limitations and what was not available
    limits:
      max_items: 5
      max_chars_item: 170
- id: S006_survey_sample
  'no': 6
  section: front
  archetype: chart_commentary
  exhibit: stacked_bar
  gate: research_gated
  provenance: blueprint
  blueprint_title: Survey Sample Distribution
  purpose: Break the survey base down by respondent type, size, and industry so cuts can be judged.
  must_contain:
  - 100% stacked bars for the overall respondent-type split, firm-size mix within each type, and industry
    mix.
  - A multi-select horizontal bar for focus industries served by one respondent group (sums >100%).
  - The n beneath every column so each cut can be evaluated independently.
  - Survey field dates and method noted in the source line.
  source_spec: Web-survey export.
  analysis: Check sample representativeness against the target's ICP; flag skews before findings are generalised.
  exhibit_spec: Three 100% stacked columns + one multi-select bar panel, all with n labels.
  quality_bar: Any sample skew acknowledged here — not discovered by the IC later.
  primary_modules:
  - SCM
  fallback_modules: []
  secondary_modules:
  - CSG
  metrics: []
  transform:
  - T1-EXTRACT
  - T11-TRIANGULATE
  - T12-COMPANY-VS-MARKET
  - T5-CALCULATE
  - T8-FACT-VS-VIEW
  calc: []
  source_priority:
  - R3
  - R5
  exception:
  - E1-NOT-PROVIDED
  - E11-NO-PRIMARY
  heads:
    chart_head: Survey sample by segment (n)
    right_head: Sampling approach and representativeness
  elements:
  - name: chart
    type: chart
    head: Survey sample by segment (n)
    limits:
      max_series: 4
      max_points: 12
  - name: right
    type: bullets
    head: Sampling approach and representativeness
    limits:
      max_items: 5
      max_chars_item: 170
- id: S007_glossary
  'no': 7
  section: front
  archetype: table_full
  exhibit: text_panel
  gate: derived
  provenance: blueprint
  blueprint_title: Glossary
  purpose: Standardise the specialist language the rest of the report depends on.
  must_contain:
  - 'Two-column table: key term | plain-English description, one row per term.'
  - Cover the industry value chain roles, the target's model-specific terms, and adjacent provider archetypes.
  - 'Include sizing and metric definitions used later: TAM, SAM, served market, gross vs net revenue,
    volume metrics.'
  - Order terms from ecosystem roles to metrics so the table reads as a primer.
  source_spec: Industry references; management materials; firm's standard definitions.
  analysis: None — alignment only; ensure definitions match how terms are used in the body.
  exhibit_spec: Clean term / description table.
  quality_bar: Every specialist term used later in the deck appears here first.
