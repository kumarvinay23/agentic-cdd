# Metric instances — the named measures the report is allowed to state.
# ---------------------------------------------------------------------------
# Why this file exists
#   A 97-slide report states the same handful of numbers many times. Without a
#   registry, TAM on slide 21 quietly disagrees with TAM on slide 37 and nobody
#   notices until the IC does. Each Metric has:
#     * exactly one record_module   -> resolves conflicts (R3, axiom A2)
#     * a subject                   -> stops market data becoming target data (A3)
#     * admissible_doc_types        -> stops a survey evidencing a valuation (R4)
#     * aliases                     -> lets a prompt name it in plain English
#   check_content.py enforces A7 (one value per metric per deck) over this list.
#
# unit_kind: currency | percent | count | ratio | score | years | label
version: 2

