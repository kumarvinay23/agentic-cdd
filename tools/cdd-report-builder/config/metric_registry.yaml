# ---------------------------------------------------------------------------
# Suitability matrix shorthand (R4). A metric class may only be evidenced by
# these doc types unless its own admissible_doc_types is wider.
suitability_defaults:
  financial:   [financials, kpi_pack, projections, cim, cap_table]
  valuation:   [financials, projections, cim, analyst]
  market:      [market_model, analyst, statistical_series, firmographic, web]
  customer:    [survey, interviews, kpi_pack, contract, cim]
  competitive: [analyst, interviews, survey, firmographic, marketing, web]
  operational: [kpi_pack, contract, interviews, cim]
  esg:         [esg, kpi_pack, cim]
  risk:        [interviews, analyst, legal, financials, kpi_pack, cim]

# Never admissible, whatever the module says. Violations raise E6-SUITABILITY at HIGH.
hard_exclusions:
  - {metric_class: valuation,  doc_type: survey,    reason: "A customer survey cannot evidence enterprise value or a multiple."}
  - {metric_class: valuation,  doc_type: interviews,reason: "Interview opinion is not a valuation input."}
  - {metric_class: financial,  doc_type: survey,    reason: "Survey respondents do not know the target's margins."}
  - {metric_class: financial,  doc_type: web,       reason: "Open-web figures are not the target's accounts."}
  - {metrics: [mkt.tam, mkt.sam, mkt.som, mkt.volume, mkt.cagr, mkt.segment_share],
     doc_type: survey,
     reason: "A survey sizes preference, never a market. R2. Qualitative market metrics
              (definition, demand drivers, price benchmarks) may cite survey evidence when it is
              attributed as such."}
  - {metric_class: market,     doc_type: financials,reason: "The target's accounts are not the market's size."}
