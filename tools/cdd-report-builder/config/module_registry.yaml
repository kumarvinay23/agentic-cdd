document_grammar:
  status: '[O] observed across the Compost Crew (v3/v4/v7) and Ola (v1/v2) corpora'
  page_form: jsPDF-rendered image-only PDF, US Letter, 2-4 pages, ~192 dpi -> OCR-first ingestion
  structure:
  - element: module_title
    pattern: ^\s*(?P<title>[A-Z][\w &/'-]{3,60})\s*$
    where: first non-empty line of page 1
  - element: section_heading
    pattern: ^\s*(?P<n>\d{1,2})\.\s+(?P<title>[^\n]{4,80})$
  - element: insight_snapshot
    pattern: ^Insight Snapshot:\s*(?P<text>.+)$
    kind: interpretation
  - element: table
    detect: 'layout: >=2 whitespace-separated columns over >=2 consecutive lines'
    kind: fact
  - element: labelled_field
    pattern: ^(?P<label>[A-Z][\w &/'-]{2,45}):\s*(?P<value>.+)$
    kind: fact
  - element: read
    pattern: ^Read:\s*(?P<text>.+)$
    kind: interpretation
  - element: synthesis
    pattern: '^Analytical Synthesis(?: & Hidden Insights)?\s*$'
    kind: interpretation
    shape: prose
  - element: verdict
    pattern: ^Verdict:\s*(?P<text>.+)$
    kind: interpretation
  - element: recommendation
    pattern: ^Recommendation:\s*(?P<text>.+)$
    kind: interpretation
  - element: confidence
    pattern: ^Confidence:\s*(?P<value>High|Medium|Low)\b
    kind: interpretation
  - element: conditions
    pattern: ^Key conditions:\s*(?P<text>.+)$
    kind: interpretation
  invariants:
  - The final numbered section of every module is its verdict section.
  - Every Insight Snapshot and Read carries at least one citation; a missing one is UNCITED_FACT.
  - Section numbering may skip when OCR loses a heading - renumber by order, never by the printed digit
    alone.
citation_grammar:
  doc_vdr:
    pattern: \(\s*DOC:\s*(?P<project>[^_]+?)\s+VDR__(?P<path>[^)]+?)\s*\)
    resolves_to: VdrNode + SourceArtifact
    basis: data_room_doc
  doc_loose:
    pattern: \(\s*DOC:\s*(?P<file>[^)_]+\.(?:pdf|pptx|xlsx|docx|txt))\s*\)
    resolves_to: SourceArtifact by fuzzy filename match; unmatched -> present=false, E10-SOURCE-DRIFT
    basis: data_room_doc
  web:
    pattern: \[(?P<n>\d{1,3})\]\s*(?P<title>[^\n\[]{4,160})
    resolves_to: SourceArtifact(provenance=web)
    basis: web
  computed:
    pattern: COMPUTED FACTS|FACT BASE|\(computed\)
    basis: data_room_computed
  note: OCR mangles underscores and periods in filenames; match on a normalised key (lowercase, strip
    non-alphanumerics) before declaring a source absent.
