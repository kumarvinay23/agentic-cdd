# VdrNode instances — the canonical data-room address space.
# ---------------------------------------------------------------------------
# Agent modules cite evidence as
#   (DOC: <Project> VDR__<section>__<subsection>__<topic>__<filename>)
# so this tree is what turns a citation string into a resolved provenance node.
# Codes and titles below are the observed Compost Crew structure [O]; `aliases`
# absorb the common variants seen in other data rooms so the resolver does not
# need an exact title match.
#
# match: ordered list of regexes tried against the citation segment, case- and
#        punctuation-insensitive, after stripping the leading numeric code.
# canonical_for: the DocTypes this node is expected to hold. Used to (a) infer a
#        SourceArtifact's doc_type when the filename is uninformative and
#        (b) raise a diligence gap when a `required` node is empty.
version: 2
separator: "__"
root_pattern: "^(?P<project>.+?)\\s+VDR$"

sections:

  "1":
    code: "1"
    title: "Corporate, Organizational & Governance"
    aliases: [corporate, governance, organizational, legal structure, company]
    required: true
    canonical_for: [cap_table, legal]
    subsections:
      "1_1":
        title: "Equity & Capitalization"
        aliases: [equity, capitalization, cap table, shareholding]
        canonical_for: [cap_table]
        topics:
          "1_1_1": {title: "Capitalization Table", canonical_for: [cap_table], required: true}
          "1_1_2": {title: "Equity Ledger",        canonical_for: [cap_table]}
      "1_2":
        title: "Corporate Governance"
        aliases: [governance, board, officers]
        canonical_for: [legal]
        topics:
          "1_2_1": {title: "Legal Entity",     canonical_for: [legal], required: true}
          "1_2_2": {title: "List of Officers", canonical_for: [legal]}

  "2":
    code: "2"
    title: "Financial Information"
    aliases: [financials, finance, financial]
    required: true
    canonical_for: [financials, kpi_pack, projections, market_model]
    subsections:
      "2_1":
        title: "Historical Financial Statement"
        aliases: [historical financials, statutory accounts, audited]
        canonical_for: [financials]
        topics:
          "2_1_1": {title: "Financial Statements",         canonical_for: [financials], required: true}
          "2_1_2": {title: "Audited Accounts",             canonical_for: [financials]}
          "2_1_3": {title: "Monthly Financial Statements", canonical_for: [financials]}
          "2_1_4": {title: "Balance Sheet Details",        canonical_for: [financials]}
          "2_1_5": {title: "Statement of Cash Flows",      canonical_for: [financials]}
      "2_2":
        title: "Management Reporting & KPIs"
        aliases: [kpis, management reporting, mis]
        canonical_for: [kpi_pack]
        topics:
          "2_2_1": {title: "Revenue by Service Line",    canonical_for: [kpi_pack], required: true}
          "2_2_2": {title: "Revenue by Customer Segment",canonical_for: [kpi_pack], required: true}
          "2_2_3": {title: "Operating KPIs",             canonical_for: [kpi_pack]}
      "2_3":
        title: "Projections & Budget"
        aliases: [forecast, budget, plan, projections]
        canonical_for: [projections, market_model]
        topics:
          "2_3_1": {title: "Financial Projections",            canonical_for: [projections], required: true}
          "2_3_2": {title: "Assumption Supporting Projections",canonical_for: [projections]}
          "2_3_3": {title: "Market Sizing",                    canonical_for: [market_model], required: true}
      "2_4":
        title: "Working Capital & Debt"
        aliases: [debt, working capital, leverage]
        canonical_for: [financials]
        topics:
          "2_4_1": {title: "Debt Schedules",      canonical_for: [financials]}
          "2_4_2": {title: "Working Capital Analysis", canonical_for: [financials]}

  "3":
    code: "3"
    title: "Customers & Commercial"
    aliases: [customers, commercial, sales, go to market]
    required: true
    canonical_for: [kpi_pack, marketing, contract, survey]
    subsections:
      "3_1":
        title: "Customer Data & Analytics"
        aliases: [customer data, analytics, cohorts]
        canonical_for: [kpi_pack, marketing]
        topics:
          "3_1_1": {title: "Marketing Materials and Service Area Maps", canonical_for: [marketing]}
          "3_1_2": {title: "Customer Contract List",                    canonical_for: [contract], required: true}
          "3_1_3": {title: "Cohort / Retention Analysis",               canonical_for: [kpi_pack], required: true}
          "3_1_4": {title: "Pipeline & Win-Loss",                       canonical_for: [kpi_pack]}
      "3_2":
        title: "Voice of Customer"
        aliases: [voc, survey, nps, interviews, primary research]
        canonical_for: [survey, interviews]
        note: >
          Absent in the Compost Crew VDR. This is the node that unlocks the
          research_gated slides (5, 6, 14, 25-30, 43-44, 51-57, 62-70, 76-80,
          92-94, 96). Its absence is a scope finding, not a defect.
        topics:
          "3_2_1": {title: "Customer Survey Export",       canonical_for: [survey]}
          "3_2_2": {title: "Interview Programme & Notes",  canonical_for: [interviews]}
          "3_2_3": {title: "NPS / Satisfaction Tracking",  canonical_for: [survey]}

  "4":
    code: "4"
    title: "Real Estate, Facilities & Fleet"
    aliases: [real estate, property, facilities, fleet, assets]
    canonical_for: [contract]
    subsections:
      "4_1":
        title: "Real Property"
        aliases: [property, leases, sites]
        canonical_for: [contract]
        topics:
