  "5":
    code: "5"
    title: "Material Contracts"
    aliases: [contracts, agreements, material agreements]
    required: true
    canonical_for: [contract]
    subsections:
      "5_1":
        title: "Other Material Agreements"
        aliases: [material agreements, grants, municipal agreements]
        canonical_for: [contract]
        topics:
          "5_1_1": {title: "Customer Agreements", canonical_for: [contract]}
          "5_1_2": {title: "Supplier Agreements", canonical_for: [contract]}

  "6":
    code: "6"
    title: "Litigation, Claims & Regulatory"
    aliases: [litigation, legal, claims, regulatory, compliance]
    required: true
    canonical_for: [legal]
    subsections:
      "6_1":
        title: "Legal Proceedings"
        aliases: [proceedings, disputes, claims]
        canonical_for: [legal]
        topics:
          "6_1_1": {title: "Litigation Register", canonical_for: [legal]}
      "6_2":
        title: "Licences & Permits"
        aliases: [licences, licenses, permits, authorisations]
        canonical_for: [legal]
        topics:
          "6_2_1": {title: "Operating Licences", canonical_for: [legal]}

  "7":
    code: "7"
    title: "ESG, Impact & Sustainability"
    aliases: [esg, impact, sustainability, carbon]
    canonical_for: [esg]
    subsections:
      "7_1":
        title: "Impact Metrics"
        aliases: [impact, metrics, diversion, ghg]
        canonical_for: [esg]
        topics:
          "7_1_1": {title: "Landfill Diversion Reporting", canonical_for: [esg]}
          "7_1_2": {title: "Carbon and GHG Impact Report", canonical_for: [esg]}
          "7_1_3": {title: "Community and Municipal Partnership Impact Summaries", canonical_for: [esg]}

  "8":
    code: "8"
    title: "Deal-Specific & Marketing Materials"
    aliases: [deal materials, transaction, cim, teaser, process]
    required: true
    canonical_for: [cim, projections]
    subsections:
      "8_1":
        title: "Transaction Materials"
        aliases: [transaction materials, deal documents]
        canonical_for: [cim, projections]
        topics:
          "8_1_1": {title: "CIM",              canonical_for: [cim], required: true}
          "8_1_2": {title: "Investor Workbook",canonical_for: [projections], required: true}
          "8_1_3": {title: "Teaser Document",  canonical_for: [cim]}
          "8_1_4": {title: "Process Letter",   canonical_for: [cim]}

# ---------------------------------------------------------------------------
# External source space — cited but not inside the VDR tree.
external:
  web:
    doc: "Cited in module text as [n] followed by a title. Resolves to a SourceArtifact with provenance=web."
    pattern: "\\[(\\d{1,3})\\]\\s*(?P<title>[^\\n\\[]{4,160})"
    doc_type_default: web
    promote_to_analyst_if: "the title names a known research house, statistical agency or regulator"
  loose:
    doc: >
      A (DOC: filename) citation with no VDR path. Observed in the Compost Crew
      corpus for CIM and process-letter versions that differ from the VDR copy
      (e.g. CC_CIM_JPC_FINAL_082426.pdf cited while the VDR holds
      CC_CIM_JPC_FINAL_090126.pptx).
    treatment: >
      Resolve by fuzzy filename match to a VDR artefact. On a match with a
      different version token, flag STALE_VERSION and apply R5. On no match, set
      present=false, flag SOURCE_ABSENT and raise E10-SOURCE-DRIFT.

# ---------------------------------------------------------------------------
# Redirect stubs — a .txt whose entire content points elsewhere. [O]
redirects:
  patterns:
    - "^\\s*Please see\\s+(?P<target>.+?)\\s*\\.?$"
    - "^\\s*(?P<target>.+?)\\s*[-–]\\s*see\\s+.+$"
    - "^\\s*Refer to\\s+(?P<target>.+?)\\s*\\.?$"
  resolution:
    - "Target of the form '<code> <Title>' resolves to that VdrNode."
    - "Target of the form '<Doc> P<n>' resolves to that artefact, page n."
    - "Target naming an artefact by name resolves by fuzzy filename match."
    - "Unresolvable target: the node counts as EMPTY, not as populated, and is listed as a diligence gap."
  negative_stubs:
    doc: >
      A stub that asserts a fact rather than redirecting — e.g.
      "No pending or scheduled threatened litigation.txt" — is a
      management_representation, not a redirect and not a gap. It is admissible
      evidence, attributed as a representation, never as a verified fact. [O]
    patterns: ["^\\s*(No|None|Nil|Not applicable)\\b"]
