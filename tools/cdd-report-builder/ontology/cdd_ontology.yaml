# DiligenceIQ Commercial Due Diligence Ontology (CDD-O)
# ---------------------------------------------------------------------------
# Purpose
#   One formal vocabulary for the whole chain
#       VDR artefact  ->  agent module  ->  evidence  ->  slide claim  ->  deck
#   so that (a) every number on a slide can be traced back to a file in the data
#   room, and (b) an arbitrary natural-language prompt can be resolved onto
#   concrete objects (a module, a metric, a slide, a rule) rather than guessed at.
#
# How to use it
#   * The TBox (classes / properties / relations / axioms) is below.
#   * The ABox — the instances — lives in:
#       config/vdr_taxonomy.yaml    VdrNode instances (data-room structure)
#       config/module_registry.yaml AgentModule + ModuleSection instances
#       config/slide_map.yaml       SlideSpec + Element instances
#       config/metric_registry.yaml Metric instances + module-of-record
#       config/crosswalk.yaml       VdrNode <-> AgentModule <-> SlideSpec edges
#       config/lexicon.yaml         surface forms -> ontology ids (prompt routing)
#   * scripts/ontology.py loads all of the above into one graph and answers
#     resolve() / lineage() / coverage() queries. Every other script uses it.
#
# Conventions
#   Ids are stable and case-sensitive. Class ids are UpperCamel, property ids are
#   lowerCamel, instance ids are the natural key of their registry
#   (module code "MVG", slide id "S037_tam_walkdown", metric id "mkt.tam").
version: 2
namespace: cddo
title: DiligenceIQ CDD Ontology
status: |
  Derived from: the Compost Crew agent-output corpus (34 modules, v3/v4/v7,
  Sept 2026), the Compost Crew VDR (8 sections), the 97-slide CDD reporting
  blueprint, and a 97-page sell-side reference report used for storyline only.
  Rules carry [O] observed in those inputs or [I] inferred design rule.

# ===========================================================================
# 1. CLASSES
# ===========================================================================
classes:

  Deal:
    doc: The engagement. Exactly one per run; everything else hangs off it.
    key: project_code
    properties:
      project_code:     {type: string,  required: true,  doc: "Project codename, e.g. 'Project Compost'."}
      client:           {type: string,  required: true,  doc: "Who the report is addressed to."}
      target:           {type: string,  required: true,  doc: "Legal/trading name of the target."}
      target_perimeter: {type: string,  required: true,  doc: "The entity/business actually being bought. E8 fires when modules disagree."}
      acquirer:         {type: string,  required: false}
      side:             {type: enum,    values: [buy_side, sell_side, refinancing, internal], required: true}
      transaction_type: {type: string,  required: false}
      industry:         {type: string,  required: true}
      geography:        {type: "string[]", required: true}
      currency:         {type: string,  required: true, doc: "Reporting currency. All C-rules present in it."}
      horizon:          {type: string,  required: false, doc: "Forecast horizon, e.g. 'FY26-FY30'."}
      report_status:    {type: enum,    values: [draft, draft_illustrative, final], required: true}
      as_of:            {type: date,    required: true}
    axioms:
      - "report_status = draft_illustrative whenever any SourceArtifact carries a synthetic marker (E7)."

  VdrNode:
    doc: >
      A node of the data-room tree. Observed shape is three levels —
      section (1_..8_) / subsection (1_1) / topic (1_1_1) — with artefacts at the
      leaves. The tree is the canonical address space for provenance: an agent's
      "(DOC: <Project> VDR__<section>__<subsection>__<topic>__<file>)" citation
      resolves to exactly one VdrNode plus one SourceArtifact. [O]
    key: path
    properties:
      path:        {type: string, required: true,  doc: "Double-underscore-joined path as it appears in DOC citations."}
      code:        {type: string, required: true,  doc: "Numeric code, e.g. '2_1_1'."}
      title:       {type: string, required: true}
      level:       {type: enum, values: [section, subsection, topic]}
      parent:      {type: ref, to: VdrNode}
      canonical_for: {type: "ref[]", to: DocType, doc: "What kind of evidence this node is expected to hold."}
      required:    {type: bool, doc: "A missing required node is a diligence gap, not just an empty folder."}

  SourceArtifact:
    doc: A single file in the data room, or a named external/web source.
    key: artifact_id
    properties:
      artifact_id:  {type: string, required: true}
      filename:     {type: string, required: true}
      vdr_node:     {type: ref, to: VdrNode, required: false, doc: "Absent for web sources and for files cited but not present (E10)."}
      doc_type:     {type: ref, to: DocType, required: true}
      format:       {type: enum, values: [xlsx, pptx, docx, pdf, txt, png, csv, web, unknown]}
      provenance:   {type: enum, values: [data_room_computed, data_room_doc, management_representation, web, uncited]}
      period:       {type: string, required: false, doc: "Period the artefact reports on, when stated."}
      version_token: {type: string, required: false, doc: "Date/version in the filename; drives R5 recency."}
      synthetic:    {type: bool, default: false}
      present:      {type: bool, default: true, doc: "false = cited by an agent but absent from the VDR (E10-SOURCE-DRIFT)."}
    axioms:
      - "A pointer stub (a .txt whose whole content is 'Please see X') is not a SourceArtifact; it is a Redirect and must be followed to its target. [O]"

  DocType:
    doc: >
      Evidence genre. Drives the suitability matrix (R4) — what a source is
      allowed to evidence — and the source-priority rules R1/R2.
    key: id
    enum_instances:
      financials:        {doc: "Statutory or management accounts, P&L, BS, CF, depreciation, debt schedules."}
      kpi_pack:          {doc: "Management reporting, revenue by line/segment, operating KPIs."}
      projections:       {doc: "Budget, forecast, investor workbook, assumption sheets."}
      cap_table:         {doc: "Capitalisation table, securities ledger."}
      market_model:      {doc: "TAM/SAM/SOM builds, expansion analyses."}
      cim:               {doc: "CIM, teaser, process letter, management presentation."}
      contract:          {doc: "Customer, supplier, lease, grant and municipal agreements."}
      legal:             {doc: "Litigation registers, regulatory correspondence, licences."}
      esg:               {doc: "Impact metrics, GHG/diversion reporting."}
      marketing:         {doc: "Sales proposals, service-area maps, collateral."}
      survey:            {doc: "Structured customer/buyer survey export with an n."}
      interviews:        {doc: "Expert, customer, churned-account or management interview programme."}
      firmographic:      {doc: "Third-party company/partner counts and attributes."}
      statistical_series: {doc: "Government or industry statistical series, macro data."}
      analyst:           {doc: "Named third-party analyst or research house publication."}
      web:               {doc: "Open-web source cited as [n]."}

  AgentModule:
    doc: >
      One diligence agent's output document. The unit the DiligenceIQ platform
      produces and the unit this skill ingests. Observed as a 2-4 page PDF of
      numbered sections; in the Compost Crew corpus they are image-only PDFs
      rendered by jsPDF, so ingestion is OCR-first. [O]
    key: code
    properties:
      code:        {type: string, required: true, doc: "Three-letter stable id, e.g. MVG."}
      title:       {type: string, required: true}
      aliases:     {type: "string[]"}
      role:        {type: enum, values: [context, finding, synthesis, appendix]}
      criticality: {type: enum, values: [core, supporting, optional]}
      sections:    {type: "ref[]", to: ModuleSection}
      record_for:  {type: "ref[]", to: Metric, doc: "Metrics for which this module is the module-of-record (R3)."}
      expects:     {type: "ref[]", to: DocType, doc: "Doc types this module should be grounded in; a mismatch raises E6."}
      version:     {type: string, doc: "vN suffix in the filename; R5 recency."}

  ModuleSection:
    doc: >
      A numbered section inside a module. Observed invariant shape:
        <n>. <Title>
        Insight Snapshot: <interpretation> (<citation>)
        <table | labelled fields>
        Read: <interpretation> (<citation>)
      followed, once per module, by "Analytical Synthesis & Hidden Insights"
      (prose) and a terminal verdict section carrying Verdict / Recommendation /
      Confidence / Key conditions. [O]
    key: [module, key]
    properties:
      n:        {type: int}
      key:      {type: string}
      title:    {type: string}
      module:   {type: ref, to: AgentModule}
      shape:    {type: enum, values: [table, fields, prose, verdict, mixed]}
      yields:   {type: "ref[]", to: EvidenceItem}

  EvidenceItem:
    doc: >
      The atom of the whole system: one table row, one labelled field, one
      snapshot/read sentence, or one verdict line, with its citations and flags.
      Everything on a slide must point at one of these by id.
    key: evidence_id
    properties:
      evidence_id: {type: string, required: true, doc: "e.g. MVG.3.r04 = module.section.row."}
      module:      {type: ref, to: AgentModule, required: true}
      section:     {type: ref, to: ModuleSection, required: true}
      kind:        {type: enum, values: [fact, interpretation], required: true,
                    doc: "fact = reported row/field. interpretation = Insight Snapshot, Read, Analytical Synthesis, Verdict."}
      basis:       {type: enum, values: [data_room_computed, data_room_doc, web, uncited], required: true}
      subject:     {type: enum, values: [target, market, competitor, customer, supplier, macro], required: true,
                    doc: "What the item is about. Enforces T12: market data never presented as target data."}
      payload:     {type: object, doc: "{columns, cells} for table rows; {label, value} for fields; {text} for prose."}
      citations:   {type: "ref[]", to: SourceArtifact}
      measures:    {type: "ref[]", to: Metric}
      period:      {type: string}
      unit:        {type: string}
      flags:       {type: "ref[]", to: Flag}
      confidence:  {type: enum, values: [high, medium, low, not_stated]}
      page:        {type: int, doc: "Source page, for crop_evidence.py verification."}
      bbox:        {type: "int[4]", doc: "OCR bounding box on that page."}
    axioms:
      - "kind=fact requires at least one citation, else flag UNCITED_FACT."
      - "An EvidenceItem whose payload matches the not_provided lexicon is populated=false and never feeds a Claim other than a gap."

  Flag:
    doc: Machine-set quality markers on evidence.
    key: id
    enum_instances:
      OCR_CURRENCY:            {severity: medium, doc: "Currency symbol unreliable after OCR; verify before use."}
      OCR_CURRENCY_AMBIGUOUS:  {severity: medium}
      LOW_OCR_CONF:            {severity: medium}
      TABLE_CLIPPED:           {severity: medium, doc: "Table wider than the rendered page; cells may be lost."}
      UNCITED_FACT:            {severity: high}
      SOURCE_SUITABILITY:      {severity: high, doc: "R4 violated — source genre cannot evidence this metric class."}
      SOURCE_ABSENT:           {severity: high, doc: "Cited file is not in the VDR (E10)."}
      SYNTHETIC:               {severity: critical}
      PLACEHOLDER:             {severity: medium, doc: "Agent emitted a template placeholder rather than a finding."}
      PERIMETER_MISMATCH:      {severity: critical}
      CONFLICT:                {severity: high}
      STALE_VERSION:           {severity: low}

  Metric:
    doc: >
      A named, typed measure with exactly one module-of-record. Metrics are what
      make consistency checkable across 97 slides: the same TAM must be the same
      number wherever it appears, and a metric may only be evidenced by a
      compatible DocType.
    key: metric_id
    properties:
      metric_id:   {type: string, required: true, doc: "Dotted, e.g. mkt.tam, fin.revenue, cust.nps."}
      label:       {type: string, required: true}
      class:       {type: enum, values: [market, financial, customer, competitive, operational, valuation, esg, risk]}
      subject:     {type: enum, values: [target, market, competitor, customer, supplier, macro]}
      unit_kind:   {type: enum, values: [currency, percent, count, ratio, score, years, label]}
      record_module: {type: ref, to: AgentModule, required: true}
      admissible_doc_types: {type: "ref[]", to: DocType, doc: "R4 suitability whitelist."}
      aliases:     {type: "string[]", doc: "Surface forms for prompt resolution."}

  SlideSpec:
    doc: >
      One page of the fixed report. Carries the blueprint's own contract —
      what it must contain, its admissible sources, the analysis it performs,
      the exhibit form and the quality bar — plus the machinery that decides
      whether it can be rendered for a given deal.
    key: id
    properties:
      id:           {type: string, required: true, doc: "S037_tam_walkdown"}
      no:           {type: int, required: true, doc: "1..97 blueprint position (+ 98..100 DiligenceIQ audit extension)."}
      section:      {type: string, required: true}
      title:        {type: string, required: true, doc: "Blueprint working title, replaced at render time by the action title."}
      purpose:      {type: string}
      must_contain: {type: "string[]", doc: "Verbatim from the blueprint; the content contract."}
      source_spec:  {type: string,   doc: "Verbatim from the blueprint."}
      analysis:     {type: string,   doc: "Verbatim from the blueprint; what work the slide performs."}
      exhibit:      {type: ref, to: Exhibit}
      quality_bar:  {type: string,   doc: "Verbatim from the blueprint; checked at QA."}
      primary_modules:   {type: "ref[]", to: AgentModule, doc: "Modules that must contribute for the slide to stand."}
      secondary_modules: {type: "ref[]", to: AgentModule}
      metrics:      {type: "ref[]", to: Metric, doc: "Metrics this slide is allowed to state."}
      rules:        {type: "ref[]", to: Rule, doc: "T/R/C/E rules that govern its drafting."}
      gate:         {type: ref, to: Gate, required: true}
      elements:     {type: "ref[]", to: Element}
      repeatable:   {type: bool, default: false, doc: "May spill onto extra pages (appendices)."}
      provenance:   {type: enum, values: [blueprint, diligenceiq_extension], default: blueprint}

  Gate:
    doc: >
      Coverage gating. This is what lets one 97-slide template serve both a
      VDR-only deal and a deal with a full primary-research programme: the
      template is fixed, the rendered deck is not.
    key: id
    enum_instances:
      always:
        doc: "Front matter, dividers, contents, back cover, audit appendix. Rendered unconditionally; content is mechanical."
      core:
        doc: >
          Must render. If its primary modules are absent or contribute no populated
          facts, this is a blocker (E9) — the report cannot be issued without it.
        rule: "all(primary_modules present) and coverage(primary_modules) > 0"
      conditional:
        doc: >
          Renders when its primary modules supply at least min_facts populated fact
          items. Otherwise dropped and logged E1 at MEDIUM (HIGH if a core module
          was expected).
        params: {min_facts: 3}
      research_gated:
        doc: >
          Requires primary-research artefacts (DocType survey or interviews) in the
          corpus. Absent those, the slide is dropped and logged E11-NO-PRIMARY at
          MEDIUM with the text "requires primary research (survey / interview
          programme)" so the gap is visible to the IC rather than silently missing.
        rule: "any(SourceArtifact.doc_type in [survey, interviews])"
        params: {min_n: 30, doc: "A survey with n < 30 is reported but never charted as a distribution."}
      derived:
        doc: "Built mechanically from other slides or run data (contents, highlights summary, source register)."

  Element:
    doc: >
      A named shape on a slide. The renderer binds content.json to shapes by
      name, so element ids are part of the template contract: renaming one
      breaks rendering, which validate_inputs.py checks before a build.
    key: [slide, name]
    properties:
      name:      {type: string, required: true}
      type:      {type: enum, values: [action_title, subtitle, bullets, table, chart, kpi_row, quote, insufficient, footnote, source_line, image]}
      limits:    {type: object, doc: "{max_chars, max_rows, max_cols, max_bullets}"}
      required:  {type: bool}

  Exhibit:
    doc: The visual grammar of the report. Chosen by the blueprint, not by taste.
    key: id
    enum_instances:
      banded_table:        {doc: "Rows grouped into named bands; used for stakeholder and archetype maps."}
      scorecard:           {doc: "Criteria x option grid with H/M/L or rating pills."}
      walkdown:            {doc: "TAM -> SAM -> Served bar walk with narrowing captions."}
      walkup:              {doc: "Base -> expansion bars building to a larger number."}
      stacked_bar:         {doc: "Composition over segments or time."}
      grouped_bar:         {doc: "Comparison across archetypes or periods."}
      line_series:         {doc: "Trend, growth factor, macro series."}
      positioning_map:     {doc: "Two-axis competitor scatter with quadrant labels."}
      decision_tree:       {doc: "Branching buyer path with conversion labels."}
      lifecycle_flow:      {doc: "Left-to-right stage flow with drop-off."}
      heat_grid:           {doc: "Criteria x segment intensity grid."}
      nps_bar:             {doc: "Promoter/passive/detractor bars with the net figure."}
      quote_wall:          {doc: "Attributed verbatims with respondent descriptors."}
      case_study:          {doc: "Situation / evaluation / outcome three-panel."}
      risk_matrix:         {doc: "Impact x likelihood grid."}
      scenario_table:      {doc: "Downside / base / upside columns with drivers."}
      method_flow:         {doc: "Sizing methodology chain with the formula at each step."}
      kpi_strip:           {doc: "Row of headline figures with period and source."}
      divider:             {doc: "Section divider."}
      cover:               {doc: "Full-bleed branded cover."}
      text_panel:          {doc: "Structured prose, used for disclaimer and glossary."}

  Claim:
    doc: >
      A drafted unit of deck content — an action title, a bullet, a table row, a
      chart series point. The bridge between evidence and pixels.
    key: [slide, element, index]
    properties:
      kind:        {type: enum, values: [fact, calc, interpretation, gap], required: true}
      text:        {type: string}
      refs:        {type: "ref[]", to: EvidenceItem, required: true}
      calculation: {type: ref, to: Calculation, required: false}
      subject:     {type: enum, values: [target, market, competitor, customer, supplier, macro]}
    axioms:
      - "kind in [fact, calc] => refs is non-empty and every number in text appears in a ref or in the calculation output."
      - "kind=calc => calculation is set and recomputes to the stated value."
      - "kind=gap => text names what is missing and why it matters; never a bare 'N/A'."
      - "subject must equal the subject of every ref (T12)."

  Calculation:
    doc: A declared derivation. check_content.py recomputes all of them.
    key: id
    properties:
      id:       {type: string}
      rule:     {type: ref, to: Rule, doc: "One of the C-rules."}
      formula:  {type: string}
      inputs:   {type: "object[]", doc: "[{value, unit, ref}]"}
      output:   {type: number}
      unit:     {type: string}
      rounding: {type: string}
      used_on:  {type: "ref[]", to: SlideSpec}

  Rule:
    doc: >
      The transformation grammar. Instances live in
      references/03_transformation_rules.md and are referenced by id from
      slide_map.yaml, speaker notes and the exception report.
    key: id
    properties:
      id:     {type: string, doc: "T*/R*/C*/E* "}
      family: {type: enum, values: [transformation, source_priority, calculation, exception, writing]}
      status: {type: enum, values: [observed, inferred], doc: "[O] / [I]"}

  Exception:
    doc: A recorded departure from the ideal. The exception report is a deliverable, not a log.
    key: id
    properties:
      rule:      {type: ref, to: Rule}
      severity:  {type: enum, values: [critical, high, medium, low]}
      issue:     {type: string}
      slides:    {type: "ref[]", to: SlideSpec}
      source:    {type: string}
      treatment: {type: string, doc: "What the deck does about it — required, not optional."}

# ===========================================================================
# 2. RELATIONS  (the lineage spine)
# ===========================================================================
relations:
  - {id: holds,          from: VdrNode,       to: SourceArtifact, card: "1:n"}
  - {id: redirectsTo,    from: SourceArtifact,to: SourceArtifact, card: "1:1",
     doc: "Pointer stub -> real artefact. Resolved during ingest so lineage never dead-ends. [O]"}
  - {id: consumes,       from: AgentModule,   to: SourceArtifact, card: "n:m",
     doc: "Materialised from DOC/web citations found in the module text."}
  - {id: hasSection,     from: AgentModule,   to: ModuleSection,  card: "1:n"}
  - {id: yields,         from: ModuleSection, to: EvidenceItem,   card: "1:n"}
  - {id: cites,          from: EvidenceItem,  to: SourceArtifact, card: "n:m"}
  - {id: measures,       from: EvidenceItem,  to: Metric,         card: "n:m"}
  - {id: recordFor,      from: AgentModule,   to: Metric,         card: "1:n",
     doc: "Module-of-record. Exactly one per metric (R3)."}
  - {id: feeds,          from: AgentModule,   to: SlideSpec,      card: "n:m",
     qualifiers: {role: [primary, secondary]}}
  - {id: states,         from: SlideSpec,     to: Metric,         card: "n:m"}
  - {id: renders,        from: SlideSpec,     to: Exhibit,        card: "n:1"}
  - {id: hasElement,     from: SlideSpec,     to: Element,        card: "1:n"}
  - {id: supportedBy,    from: Claim,         to: EvidenceItem,   card: "n:m"}
  - {id: derivedBy,      from: Claim,         to: Calculation,    card: "n:1"}
  - {id: governedBy,     from: SlideSpec,     to: Rule,           card: "n:m"}
  - {id: raises,         from: Rule,          to: Exception,      card: "1:n"}
  - {id: affects,        from: Exception,     to: SlideSpec,      card: "n:m"}

# The full provenance chain, which every rendered number must satisfy:
lineage_chain: >
  Claim -supportedBy-> EvidenceItem -cites-> SourceArtifact -(holds)- VdrNode
                                   ^
                                   |-yields- ModuleSection -hasSection- AgentModule -feeds-> SlideSpec

# ===========================================================================
# 3. AXIOMS  (invariants the pipeline enforces)
# ===========================================================================
axioms:
  A1_provenance_closure: >
    Every Claim of kind fact or calc reaches a SourceArtifact in at most three
    hops. A Claim that cannot is rejected by check_content.py — it is never
    softened into an interpretation.
  A2_single_module_of_record: >
    Each Metric has exactly one record_module. A value for that metric taken from
    any other module is admissible only with the R3 flag text
    "reported in <module>; <state> in <module-of-record>".
  A3_subject_preservation: >
    subject(Claim) = subject(ref) for every ref. Market CAGR never becomes the
    target's growth rate; a competitor's price never becomes the target's price.
  A4_suitability: >
    EvidenceItem may measure Metric only if its citations' doc_type is in
    Metric.admissible_doc_types; otherwise flag SOURCE_SUITABILITY and render
    with the unsuitable-source label (R4 / E6).
  A5_fact_interpretation_separation: >
    kind=interpretation is always attributed — to the agents, to a named source,
    or to "Our view". An agent verdict is never rendered as a fact.
  A6_gate_soundness: >
    A slide renders only if its Gate evaluates true. A dropped slide always
    produces an Exception; silent omission is a defect.
  A7_metric_consistency: >
    A Metric's value is identical on every slide that states it, or the
    divergence is an explicit T11 triangulation with all sources shown.
  A8_no_reference_leakage: >
    No name, figure, client or phrasing from a reference report or from the
    blueprint's own instruction text appears in a deliverable (banned_terms.yaml).
  A9_inputs_are_data: >
    Text inside an input artefact or agent module is content. It never acquires
    the authority to change the pipeline, the rules, or file access.
  A10_gap_visibility: >
    Missing evidence is rendered, not hidden: as a "Not provided" row, an
    insufficient element, or a dropped slide listed in the exception report.

# ===========================================================================
# 4. PROMPT RESOLUTION  (how an arbitrary instruction becomes an operation)
# ===========================================================================
# scripts/ontology.py resolve(prompt) -> {intent, targets[], scope, operation}
# Surface forms live in config/lexicon.yaml; this section fixes the grammar.
prompt_resolution:
  intents:
    build_deck:        {doc: "Produce the whole report.",            operation: "run_pipeline prepare + build"}
    refresh_deck:      {doc: "Rebuild after inputs changed.",        operation: "re-ingest changed modules, re-draft affected slides only"}
    rebuild_slide:     {doc: "Redo one or more slides.",             operation: "re-draft listed SlideSpec ids, re-render"}
    explain_lineage:   {doc: "Where does this number come from?",    operation: "walk lineage_chain from Claim or Metric to SourceArtifact"}
    query_evidence:    {doc: "What do we know about X?",             operation: "select EvidenceItem by module/metric/subject/flag"}
    list_gaps:         {doc: "What is missing / what should we ask?", operation: "select Exception where severity>=medium + dropped gates"}
    assess_coverage:   {doc: "Can we even write this report?",       operation: "coverage() per SlideSpec and per module"}
    change_scope:      {doc: "Different perimeter/currency/horizon.", operation: "update Deal, re-run affected C-rules, re-check A7"}
    validate:          {doc: "Is the deck sound?",                   operation: "check_content + qa_deck + axiom sweep"}
    explain_rule:      {doc: "Why is it done this way?",             operation: "return Rule + its slides"}
    review:            {doc: "Review an analysis against controls C1-C6", operation: "run controls + reconcile; return issue register and revised conclusion"}
  resolution_order:
    - "1. Explicit ids win: 'S037', 'slide 37', 'MVG', 'mkt.sam' resolve directly."
    - "2. Then lexicon aliases: an alias maps to exactly one ontology id, or to a named bundle."
    - "3. Then class inference from the verb: build/draft -> SlideSpec; where/source/trace -> lineage; missing/gap -> Exception."
    - "4. Then section/theme bundles: 'market sizing', 'the competitive section' expand to a slide list."
