# Cloud Build → Google Artifact Registry
# Usage:
#   gcloud builds submit --config=cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_AR_REPOSITORY=agetic-cdd,_TAG=latest .
#
# Prerequisites:
#   1. gcloud auth login && gcloud config set project YOUR_PROJECT_ID
#   2. Enable APIs: artifactregistry.googleapis.com, cloudbuild.googleapis.com
#   3. Create the Docker repo (once):
#        gcloud artifacts repositories create agetic-cdd \
#          --repository-format=docker \
#          --location=us-central1 \
#          --description="Agentic CDD container images"

substitutions:
  _REGION: us-central1
  _AR_REPOSITORY: agetic-cdd
  _TAG: latest
  # Browser-facing API URL for the web image (override per environment)
  _NEXT_PUBLIC_API_URL: http://127.0.0.1:4600

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/agetic-cdd-api:${_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/agetic-cdd-web:${_TAG}

steps:
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.api
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/agetic-cdd-api:${_TAG}
      - .

  - id: build-web
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.web
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/agetic-cdd-web:${_TAG}
      - .
    waitFor: ["-"]
