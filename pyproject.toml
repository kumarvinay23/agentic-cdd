[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agetic-cdd"
version = "0.1.0"
description = "Agentic CDD — AI-assisted deal diligence portfolio"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Agentic CDD" }
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
agetic-cdd = "agetic_cdd.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agetic_cdd = ["templates/*.html", "static/css/*.css", "static/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
