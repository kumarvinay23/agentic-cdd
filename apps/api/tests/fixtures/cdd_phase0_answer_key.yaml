# Phase 0 answer key for the CDD deck.
# Negative cases are statements the scored deck made that the facts contradict.
# Positive cases are the findings the deck must compute. Wording can change.
# open: true means the current engine still misses the case. The test xfails it.
# When a fix lands, the test fails until open is set to false.
# None of these names or figures belong in the deck engine. They are fixtures.

