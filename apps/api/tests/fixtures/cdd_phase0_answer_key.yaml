cases:
  - id: N-diverge
    fix: F1
    open: false
    polarity: negative
    rule: Do not say the retention curves diverge when every paired point is within 1 point.

  - id: N-returned-to-profit
    fix: F1
    open: false
    polarity: negative
    rule: Do not say EBITDA returned to profit in the latest year when an earlier actual year is already positive.

  - id: N-evidenced-model
    fix: F8
    open: false
    polarity: negative
    rule: Do not call the company workbook an evidenced model.

  - id: N-cost-tie
    fix: F2
    open: false
    polarity: negative
    rule: Cost lines on the page plus EBITDA must equal revenue within 0.01.

  - id: N-decoy-revenue
    fix: F1
    open: false
    polarity: negative
    rule: A modelled contract amount must not be stored as historical company revenue.

  - id: N-wrong-column
    fix: F3
    open: false
    polarity: negative
    rule: A percentage must not sit under a column headed Not established.

  - id: N-date-column
    fix: F3
    open: false
    polarity: negative
    rule: The history date column must hold years, not section labels.

  - id: N-plan-as-milestone
    fix: F3
    open: false
    polarity: negative
    rule: An uncompleted plan item must not be listed as a milestone that happened.

  - id: N-picture-title
    fix: F3
    open: false
    polarity: negative
    rule: A picture description must not be the page title.

  - id: N-mixed-price-axis
    fix: F10
    open: false
    polarity: negative
    rule: A household monthly price and a location monthly price must not share one axis when the larger is more than 8 times the smaller.

  - id: N-period-debug
    fix: F3
    open: false
    polarity: negative
    rule: Debug text such as period counts and CIM-gap counts must not reach a page.

  - id: N-stale-margin-lead
    fix: F3
    open: false
    polarity: negative
    rule: The snapshot must not lead with an earlier year's margin when a later year is on the page.

  - id: N-databook-promoted
    fix: F3
    open: false
    polarity: negative
    rule: Databook-promoted debug text must not reach a page.

  - id: N-margin-chart
    fix: F10
    open: false
    polarity: negative
    rule: Gross margin and EBITDA margin must not be categories of one series.

  - id: N-bridge-waterfall
    fix: F10
    open: false
    polarity: negative
    rule: The plan bridge must be a waterfall.

  - id: N-bridge-basis
    fix: F2
    open: false
    polarity: negative
    rule: The bridge must use one revenue basis for the actual and the plan.

  - id: P-ytd
    fix: F4
    open: false
    polarity: positive
    rule: The snapshot must compare year-to-date with the same months of the prior year.

  - id: P-margin-compare
    fix: F5
    open: false
    polarity: positive
    rule: The margin title must state that gross margin held and EBITDA margin fell.

  - id: P-trading
    fix: F4
    open: false
    polarity: positive
    rule: The scenario page must show the trading case and the plan together.

  - id: P-model-vs-billed
    fix: F4
    open: false
    polarity: positive
    rule: The model price per home per year must be set against the billed price per month.

  - id: P-annualize
    fix: F7
    open: false
    polarity: positive
    rule: A monthly retention claim must be shown as an annual rate, monthly rate to the power of 12.

  - id: P-competitors
    fix: F9
    open: false
    polarity: positive
    rule: Name at least three competitors read outside the data room and one published price, or state that no outside competitor research was loaded.

  - id: P-graded-summary
    fix: F6
    open: false
    polarity: positive
    rule: Investment highlights must open with graded findings and what to test before signing.

  - id: P-insight-title
    fix: F5
    open: false
    polarity: positive
    rule: A margin title must not be only one restated number.
